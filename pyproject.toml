[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perathos-gate"
version = "0.1.0"
description = "Perathos Gate server: passkey-signed human approval for irreversible AI agent actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "perathos>=1.3.0,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "webauthn>=2.0,<4",
    "jinja2>=3.1",
    "cryptography>=42",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "httpx>=0.27", "cbor2>=5.6", "ruff>=0.5"]

[project.scripts]
perathos-gate = "perathos_gate.cli:main"

[tool.setuptools]
packages = ["perathos_gate"]

[tool.setuptools.package-data]
perathos_gate = ["templates/*.html", "static/*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
